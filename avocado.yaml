default_target: imx93-frdm
supported_targets:
  - imx93-frdm

extensions:
  avocado-bsp-imx93-frdm:
    version: 0.2.0
    release: r0
    summary: Board support for the i.MX 93 FRDM
    description: Board support for the i.MX 93 FRDM
    license: Apache-2.0
    url: https://github.com/avocadolinux/avocado-os
    vendor: Avocado Linux <info@avocadolinux.org>

    on_merge:
      # modules-load.d files that arrive with the extension (moal's, below)
      # were not there when systemd-modules-load ran at boot; run it again.
      - systemctl restart systemd-modules-load.service
      - udevadm control --reload
      - udevadm trigger --type=subsystems --action=add --settle
      - udevadm trigger --type=devices --action=add --settle

    # Drivers the board's device tree enables that the kernel builds as
    # modules. avocado-cli suffixes kernel-module names with the kernel
    # version at install time. Without them the parts below are described
    # but never bound (no CAN, Wi-Fi, Bluetooth, external RTC or audio).
    packages:
      # CAN: FlexCAN with the on-board transceiver.
      kernel-module-flexcan: '*'
      kernel-module-can-dev: '*'
      # External RTC (PCF2131 on I2C).
      kernel-module-rtc-pcf2127: '*'
      # On-board IW612 module (the driver reports card type 0x109 and asks for
      # nxp/sduart_nw61x_v1.bin.se; the device tree's Bluetooth node still says
      # 88w8987): Wi-Fi on SDIO through NXP's moal/mlan driver, Bluetooth on
      # UART through btnxpuart. moal has no SDIO device table, so udev never
      # loads it: its package's modules-load.d entry does (see on_merge).
      kernel-module-moal: '*'
      kernel-module-mlan: '*'
      kernel-module-cfg80211: '*'
      kernel-module-btnxpuart: '*'
      kernel-module-bluetooth: '*'
      firmware-nxp-wifi-nxp-common: '*'
      firmware-nxp-wifi-nxpiw612-sdio: '*'
      # regulatory.db for cfg80211; without it Wi-Fi stays on the world domain
      # and the kernel logs a failed firmware load at boot.
      wireless-regdb-static: '*'
      # Audio: the MQS output through SAI, as the sound-mqs card.
      kernel-module-snd-soc-fsl-asoc-card: '*'
      kernel-module-snd-soc-fsl-mqs: '*'
      kernel-module-snd-soc-fsl-sai: '*'
      kernel-module-snd-soc-fsl-utils: '*'

# What a hub does with the FRDM's Rubicon around `avocado provision
# --rubicon` (and `avocado rubicon run`). A project replaces one by defining
# a run profile of the same name. The Rubicon's outputs are generic; on this
# target they are wired (README):
#   power  a power relay feeding the board's USB-C PD adapter
#   ssr1   a photo relay across SW1-1 (BOOT_MODE0); SW1 is left all off
#   ssr2   a photo relay across SW1-2 (BOOT_MODE1)
#   ssr3   a photo relay across P19 (SYS_nRST)
#   SDWire3 on the Rubicon's USB port, its tongue in the microSD slot (P13)
#     (sd profile), or the P2 USB device port on it (uuu-emmc profile)
rubicon:
  run:
    imx93-power-off:
      - out: { power: "off" }
    imx93-power-on:
      - out: { power: "on" }
    # SW1[3:0]: 0011 microSD, 0010 eMMC, 0001 USB serial download.
    imx93-boot-sd:
      - out: { ssr1: "on", ssr2: "on" }
    imx93-boot-emmc:
      - out: { ssr1: "off", ssr2: "on" }
    imx93-boot-serial-download:
      - out: { ssr1: "on", ssr2: "off" }
    imx93-reset:
      - pulse: { ssr3: 200 }
    # Before the sd profile: the board off, its card in the SDWire3 handed to
    # the hub, where stone's sd profile writes the image to it.
    imx93-sd-write:
      - run: imx93-power-off
      - wait_ms: 1000
      - sd_mux: host
    # After it: the card back in the board, set to boot from it, power on.
    imx93-sd-boot:
      - sd_mux: dut
      - run: imx93-boot-sd
      - wait_ms: 500
      - run: imx93-power-on

    # Before the uuu-emmc profile: the board power-cycled into USB serial
    # download. The ROM reads the boot mode only at power-up. Hold every id
    # the flash goes through: the ROM (SDPS, 1fc9:014e), an SPL that streams
    # U-Boot over SDP (SDPV, 1fc9:0151), and U-Boot's fastboot (1fc9:0152),
    # which writes the eMMC. Not "*": the board's debug port (a CH342 on the
    # same Rubicon USB port) is the console, and holding it takes it away.
    imx93-enter-serial-download:
      - run: imx93-power-off
      - run: imx93-boot-serial-download
      - wait_ms: 3000
      - run: imx93-power-on
      - hold_usb: ["1fc9:014e", "1fc9:0151", "1fc9:0152"]
      - wait_usb: { id: "1fc9:014e", timeout_s: 30 }
    # After it: set to boot from eMMC and power-cycle.
    imx93-emmc-boot:
      - run: imx93-power-off
      - run: imx93-boot-emmc
      - wait_ms: 3000
      - run: imx93-power-on

provision:
  sd:
    rubicon: { before: imx93-sd-write, after: imx93-sd-boot }
  uuu-emmc:
    rubicon: { before: imx93-enter-serial-download, after: imx93-emmc-boot }

sdk:
  image: docker.io/avocadolinux/sdk:{{ env.AVOCADO_DISTRO_RELEASE }}
